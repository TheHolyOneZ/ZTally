[package]
name = "ztally"
version = "0.1.0"
description = "Local, private screen-time tracker for Linux and Windows"
authors = ["TheHolyOneZ"]
homepage = "https://zsync.eu/ztally/"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.82"

[lib]
name = "ztally_lib"
# Desktop only: no mobile staticlib/cdylib (their export table overflows MinGW's limit).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
tiny_http = "0.12"
getrandom = "0.3"
parking_lot = "0.12"
sys-locale = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["screensaver"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
