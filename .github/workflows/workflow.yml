name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - name: Windows
            os: windows-latest
            bundles: nsis
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$app" != "$tag" ]; then
            echo "::error::Tag v$tag but tauri.conf.json says $app. Bump the version first."
            exit 1
          fi

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils file

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Frontend checks (types, translations)
        run: |
          pnpm exec tsc --noEmit
          pnpm check:locales

      - run: pnpm build

      - name: Engine tests
        working-directory: src-tauri
        run: cargo test

    
      - name: Windows backend smoke test
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test live_sample -- --ignored --nocapture

      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Check glibc requirement
        if: runner.os == 'Linux'
        run: |
          need="$(objdump -T src-tauri/target/release/ztally | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)"
          echo "The binary needs $need"
          if [ "$(printf '%s\n' "$need" GLIBC_2.35 | sort -V | tail -1)" != "GLIBC_2.35" ]; then
            echo "::error::$need is newer than Ubuntu 22.04's glibc 2.35."
            exit 1
          fi

      - name: Collect files
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm \
               src-tauri/target/release/bundle/appimage/*.AppImage out/
          else
            cp src-tauri/target/release/bundle/nsis/*-setup.exe out/
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            ver="$(node -p "require('./src-tauri/tauri.conf.json').version")"
            (cd extension && zip -r "../out/ZTally-Bridge_${ver}.zip" . -x "*.DS_Store")
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ZTally-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        run: |
          cd out
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ZTally ${{ github.ref_name }}
          files: out/*
